name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check
        run: npm run security

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Smoke test PR review
        run: npm run smoke:pr-review

      - name: Verify packed consumers
        run: npm run security:consumers

  auto-tag:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Tag release if package versions were bumped
        shell: bash
        run: |
          set -euo pipefail
          repocairn_version="$(node -p "require('./packages/repocairn/package.json').version")"
          secondpair_version="$(node -p "require('./packages/secondpair/package.json').version")"

          if [[ "$repocairn_version" != "$secondpair_version" ]]; then
            echo "repocairn ($repocairn_version) and secondpair ($secondpair_version) versions differ; skipping auto-tag." >&2
            exit 0
          fi

          tag="v$repocairn_version"
          if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
