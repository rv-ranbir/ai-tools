# Copy to bitbucket-pipelines.yml at the root of the consuming Bitbucket repository.
#
# Setup — Repository settings -> Repository variables:
#   ANTHROPIC_API_KEY (secured)   — or OPENROUTER_API_KEY / OPENAI_API_KEY
#                                   plus PR_REVIEW_MODEL for non-Anthropic providers
#   BITBUCKET_TOKEN   (secured)   — repository access token with the
#                                   pullrequest:write scope, used by --post to
#                                   create inline PR comments
#
# The review step runs on every pull request: it fetches the PR diff from the
# Bitbucket API (workspace/repo/PR id are auto-detected from Pipelines env
# vars), posts findings as inline comments on the changed lines, and fails the
# pipeline when findings reach the fail_on threshold (.pr-review.yml or
# --fail-on). pr-review-report.json is kept as a build artifact.

pipelines:
  pull-requests:
    "**":
      - step:
          name: PR Review Agent
          image: node:20
          script:
            # Install the CLI. Pick one:
            #   from npm (once published):        npm install -g pr-review-agent
            #   from a git remote:                npm install -g git+https://bitbucket.org/YOUR_WORKSPACE/repomind.git
            - npm install -g pr-review-agent
            - pr-review review --post --fail-on high
          artifacts:
            - pr-review-report.json

  branches:
    main:
      - step:
          name: Update review codemap
          image: node:20
          script:
            - npm install -g pr-review-agent
            - pr-review index
            # Push the refreshed memory back. Requires repo write access for the
            # pipeline (Repository settings -> Pipelines -> enable write access,
            # or an app password in a secured variable).
            - |
              if ! git diff --quiet -- .repomind/index.json; then
                git config user.name "pipelines-bot"
                git config user.email "pipelines-bot@users.noreply.bitbucket.org"
                git add .repomind/index.json
                git commit -m "chore: update repomind index [skip ci]"
                git push origin main
              fi
