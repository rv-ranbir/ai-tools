# LEGACY / DISCOURAGED — prefer local `repocairn init` hooks (pre-commit / pre-push)
# so the brain is updated before push. repocairn is not a CI product; CI consumers
# (secondpair) should only *read* the committed `.repocairn/index.json`.
#
# Copy to .github/workflows/update-index.yml only if you still want CI to rewrite
# the index after merges to main.
name: Update Review Codemap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    # Skip the bot's own commits.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install secondpair
        run: npm install -g YOUR_GITHUB_USERNAME/repocairn  # or: npm i -g secondpair

      - name: Update codemap incrementally
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pr-review index

      - name: Commit updated index
        run: |
          if git diff --quiet -- .repocairn/index.json; then
            echo "Codemap unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repocairn/index.json
          git commit -m "chore: update repocairn index [skip ci]"
          git push
