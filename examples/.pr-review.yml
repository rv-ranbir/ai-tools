# Example .pr-review.yml — place at the root of the consuming repository.
# Every key is optional; these are the defaults unless noted.

# Fail the CI check when any finding is at or above this severity.
fail_on: high            # critical | high | medium | low | info

# Drop findings the model rated below this confidence (0..1).
min_confidence: 0.5

# Paths excluded from review AND from the codemap index (glob patterns,
# merged with built-in defaults like node_modules/, dist/, lockfiles).
ignore:
  - "**/*.gen.ts"
  - "docs/**"

# Token budget for repo context injected into the review prompt.
context_token_budget: 8000

# Inline the full source of the top-N related files (importers first) into the
# prompt, on top of the summary/symbol context. 0 disables.
context_snippets: 3

# Free-text instructions appended to the review prompt.
custom_instructions: |
  Flag missing JSDoc on exported functions.
  We use dependency injection — flag direct instantiation of services.

# Disable finding categories entirely.
categories:
  naming: false

# Sampling temperature. OpenAI-compatible providers already default to 0;
# setting this also forces it on Anthropic (which disables adaptive thinking).
# temperature: 0

# Caps against pad-spam: beyond these, lowest-confidence findings are dropped.
limits:
  max_findings_per_file: 5
  max_total: 30

# Second drop-only LLM pass that removes findings the model would walk back
# when challenged. Costs one extra call per review. Default: false.
self_critique: false

# Redact common secrets before sending diffs and context to the model.
redact_secrets: true

# Additional JavaScript regular expressions whose matches should be redacted.
redact_patterns: []

# Persist finding ids marked "won't fix" to .pr-review-suppressions.yml.
write_suppressions: false
